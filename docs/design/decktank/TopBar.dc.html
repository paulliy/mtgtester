<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&amp;family=Bodoni+Moda:opsz,wght@6..96,400&amp;family=Cutive+Mono&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2d2a2a}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #2d2a2a;outline-offset:3px}
.ruler-tick-bg{background-image:repeating-linear-gradient(to right,#2d2a2a 0 1px,transparent 1px 0.6rem);background-size:100% 6px;background-repeat:no-repeat;background-position:left bottom}
@keyframes orrDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes orrFade{from{opacity:0}to{opacity:1}}
@media (max-width: 760px){
  .ruler{display:none !important}
  .brand-btn{display:inline-flex !important}
  .brand-name{display:none !important}
  .pad{padding-left:1rem !important;padding-right:1rem !important}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</helmet>
<div style="background: #f5f3ec; color: #2d2a2a; font-family: 'Cutive Mono', 'Courier New', ui-monospace, monospace">
  <header class="pad" style="position: relative; z-index: 20; flex: 0 0 auto; display: flex; align-items: stretch; gap: 2rem; min-height: 4.25rem; padding: 0 2rem; border-bottom: 1px solid #2d2a2a; animation: orrFade 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) both">
    <a href="Main.dc.html" class="brand-name" style="align-self: center; flex: 0 0 auto; text-decoration: none; font-family: 'Bodoni Moda', Didot, 'Times New Roman', serif; font-size: 1.35rem; line-height: 1; letter-spacing: -0.03em; text-transform: uppercase">Decktank</a>

    <!-- The ruler: every place on a big tick; the warm tick is where you are, and slides to where you point -->
    <nav class="ruler" aria-label="Places" onMouseLeave="{{navRest}}" style="flex: 1 1 auto; min-width: 0; display: flex; justify-content: flex-end; align-self: stretch">
      <div class="ruler-tick-bg" style="position: relative; display: flex; align-items: stretch; padding: 0 0.6rem">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="6">
          <a href="{{n.href}}" onMouseEnter="{{n.hover}}" onFocus="{{n.hover}}" onBlur="{{navRest}}" aria-current="{{n.current}}" style="position: relative; width: 7.2rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.15rem; padding-bottom: 1rem; text-decoration: none; text-align: center">
            <span style="min-height: 0.9rem; font-size: 0.6rem; letter-spacing: 0.09em; color: #66625f">{{n.group}}</span>
            <span style="font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; color: {{n.color}}; transition: color 0.3s cubic-bezier(0.165, 0.84, 0.44, 1)">{{n.label}}</span>
            <span aria-hidden="true" style="position: absolute; left: 50%; bottom: 0; width: 1px; height: {{n.tick}}; background: #2d2a2a"></span>
          </a>
        </sc-for>
        <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 1px; background: #2d2a2a"></span>
        <span aria-hidden="true" style="position: absolute; bottom: 0; left: 0.6rem; width: 3px; height: 1.35rem; margin-left: -1.5px; background: #a77e5f; transform: translateX(calc({{navAt}} * 7.2rem + 3.6rem)); transition: transform 0.55s cubic-bezier(0.165, 0.84, 0.44, 1)"></span>
      </div>
    </nav>

    <!-- Phones: the name is the menu -->
    <button type="button" class="brand-btn" onClick="{{toggleNav}}" aria-expanded="{{navOpen}}" style="display: none; align-self: center; align-items: center; gap: 0.6rem; min-height: 44px; font-family: 'Bodoni Moda', Didot, serif; font-size: 1.15rem; letter-spacing: -0.03em; text-transform: uppercase">
      Decktank
      <svg width="12" height="8" viewBox="0 0 12 8" aria-hidden="true" style="transform: rotate({{caret}}deg); transition: transform 0.3s cubic-bezier(0.165, 0.84, 0.44, 1)"><path d="M1 1 L6 6 L11 1" fill="none" stroke="#2d2a2a" stroke-width="1.2"></path></svg>
    </button>
    <sc-if value="{{navOpen}}" hint-placeholder-val="{{ false }}">
      <!-- Phones: the name opens a full sheet of places, grouped as on the ruler -->
      <nav aria-label="Places" style="position: absolute; left: 0; right: 0; top: 100%; height: calc(100vh - 4.25rem); overflow: auto; display: flex; flex-direction: column; padding: 0.5rem 1rem 1.25rem; background: #eeeadf; border-bottom: 1px solid #2d2a2a; animation: orrDrop 0.35s cubic-bezier(0.165, 0.84, 0.44, 1) both">
        <sc-for list="{{sheet}}" as="r" hint-placeholder-count="9">
          <sc-if value="{{r.head}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; align-items: baseline; gap: 0.75rem; padding: 1.4rem 0 0.5rem; border-bottom: 1px solid #2d2a2a; animation: orrDrop 0.45s cubic-bezier(0.165, 0.84, 0.44, 1) {{r.delay}} both">
              <span style="font-family: 'Bodoni Moda', Didot, serif; font-size: 1.5rem; line-height: 1; min-width: 2.2rem">{{r.num}}</span>
              <span style="font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: #66625f">{{r.name}}</span>
            </div>
          </sc-if>
          <sc-if value="{{r.item}}" hint-placeholder-val="{{ true }}">
            <a href="{{r.href}}" onClick="{{r.go}}" aria-current="{{r.current}}" style="position: relative; display: flex; align-items: center; gap: 0.75rem; min-height: 3.9rem; padding: 0.55rem 0 0.55rem 2.95rem; border-bottom: 1px solid #bdbbb6; text-decoration: none; animation: orrDrop 0.45s cubic-bezier(0.165, 0.84, 0.44, 1) {{r.delay}} both">
              <span aria-hidden="true" style="position: absolute; left: 0; top: 0.9rem; bottom: 0.9rem; width: 3px; background: {{r.markBg}}"></span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0.3rem">
                <span style="font-family: Archivo, 'Helvetica Neue', Arial, sans-serif; font-size: 0.95rem; letter-spacing: 0.08em; text-transform: uppercase">{{r.label}}</span>
                <span style="font-size: 0.72rem; line-height: 1.35; color: #66625f">{{r.desc}}</span>
              </span>
              <span aria-hidden="true" style="flex: 0 0 auto; font-family: Archivo, sans-serif; font-size: 1rem; color: {{r.arrow}}">&#8594;</span>
            </a>
          </sc-if>
        </sc-for>
        <div aria-hidden="true" style="margin-top: auto; padding-top: 2rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: #8f8c88; animation: orrFade 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) 0.4s both">
          <svg width="22" height="22" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="#8f8c88" stroke-width="1"></circle><path d="M20 4 L23 20 L20 36 L17 20 Z M4 20 L20 17 L36 20 L20 23 Z" fill="none" stroke="#8f8c88" stroke-width="1"></path><path d="M20 4 L23 20 L17 20 Z" fill="#a77e5f"></path></svg>
          <span>Decktank &#183; Commander table</span>
          <span style="flex: 1 1 auto; height: 1px; background: #bdbbb6"></span>
        </div>
      </nav>
    </sc-if>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"int","default":0,"min":0,"max":5},"$preview":{"width":1440,"height":68}}'>
const SHEET = [
  ['I', 'New game', [['New game', 'Main.dc.html', 'Play, watch or batch a four-seat table']]],
  ['II', 'Records', [['Stats', 'Stats.dc.html', 'Standings, matchups and how each deck fares'], ['Batch runs', 'Batches.dc.html', 'Queued, running and finished batches']]],
  ['III', 'Workshop', [['Card lab', 'CardLab.dc.html', 'Put single cards through the rules engine'], ['Deals', 'Deals.dc.html', 'Preview opening hands before a game'], ['Debug', 'Debug.dc.html', 'Engine log, game state and seeds']]],
];
function sheetRows(cur, go) {
  const rows = []; let i = 0, n = 0;
  for (const [num, name, items] of SHEET) {
    rows.push({ head: true, item: false, num, name, delay: (n++ * 0.04) + 's' });
    for (const [label, href, desc] of items) {
      const k = i++;
      rows.push({ head: false, item: true, label, href, desc, delay: (n++ * 0.04) + 's', current: k === cur ? 'page' : 'false', markBg: k === cur ? '#a77e5f' : 'transparent', arrow: k === cur ? '#a77e5f' : '#2d2a2a', go: go ? (e) => go(k, e) : undefined });
    }
  }
  return rows;
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { navHover: null, navOpen: false };
  }
  renderVals() {
    const s = this.state;
    const set = (p) => this.setState(p);
    const cur = Number(this.props.current) || 0;
    const items = [
      ['I', 'New game', 'Main.dc.html'], ['II', 'Stats', 'Stats.dc.html'], ['', 'Batch runs', 'Batches.dc.html'],
      ['III', 'Card lab', 'CardLab.dc.html'], ['', 'Deals', 'Deals.dc.html'], ['', 'Debug', 'Debug.dc.html'],
    ];
    const at = s.navHover ?? cur;
    return {
      nav: items.map(([group, label, href], i) => ({
        group, label, href,
        current: i === cur ? 'page' : 'false',
        color: i === at ? '#2d2a2a' : '#66625f',
        tick: group ? '0.9rem' : '0.55rem',
        markBg: i === cur ? '#a77e5f' : 'transparent',
        hover: () => { if (this.state.navHover !== i) set({ navHover: i }); },
      })),
      navAt: at,
      navRest: () => { if (this.state.navHover != null) set({ navHover: null }); },
      navOpen: !!s.navOpen,
      sheet: sheetRows(cur, null),
      toggleNav: () => set({ navOpen: !s.navOpen }),
      caret: s.navOpen ? 180 : 0,
    };
  }
}
</script>
</body>
</html>
