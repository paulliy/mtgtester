name: CI

on:
  pull_request:
    # ready_for_review starts the full run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only touches prose under these directories cannot change any test, typecheck,
  # lint, or build result, so the heavy jobs below are skipped for it. Each path here must be one that
  # no test, script, or build reads. Files that code does read (docs/rules, docs/plans, docs/reviews,
  # docs/modelled-cards.md, README.md, data/) are deliberately absent. The format job always runs,
  # because prettier also checks Markdown. Pushes to main always run everything.
  #
  # Actions minutes: the two slow jobs (full test suite, about 18 minutes, and Playwright, about 29)
  # also skip while a pull request is a draft (`full` below). They run when it is marked ready for
  # review, on every push after that, and on main. A skipped job still satisfies a required check.
  changes:
    name: Changes / Classify
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$DRAFT" == "true" ]]; then
            echo "Draft pull request: skipping the full test suite and Playwright."
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
          # On any diff failure, fail open: run everything.
          # Three-dot diff: files changed on the PR branch since its merge base, not base-branch drift.
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "::warning::Could not compute changed files; running all jobs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/decisions/*|docs/guides/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          if [[ "$docs_only" == "true" ]]; then
            echo "Docs-only change: skipping code jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs for every change, including docs-only, because prettier checks Markdown.
  format:
    name: Quality / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run format:check

  typecheck:
    name: Quality / Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run typecheck
      - run: bun run typecheck:tests

  lint:
    name: Quality / Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run lint

  web-build:
    name: Quality / Web build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run --cwd apps/web build

  engine-tests:
    name: Engine / Full test suite
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run test
      # Every tracked test file collects at least one test from its runner (ADR 0034 decision 9).
      # It lists every runner's tests without running them: about 2.5 minutes, measured locally,
      # nearly all of it Vitest importing the suites.
      - run: bun run check:suite-collect

  ai-benchmark-contracts:
    name: AI / Benchmark contracts and privacy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      # Deterministic only: no provider key and no live model calls are available to PR code.
      - run: >-
          bun run test
          packages/server/src/benchmark/hash.test.ts
          packages/server/src/benchmark/source-hash.test.ts
          packages/server/src/benchmark/refresh.test.ts
          packages/server/src/benchmark/capture.test.ts
          packages/server/src/benchmark/promotion.test.ts
          packages/server/src/benchmark/contracts.test.ts
          packages/server/src/benchmark/paths.test.ts
          packages/server/src/benchmark/cases.test.ts
          packages/server/src/benchmark/replay.test.ts
          packages/server/src/benchmark/score.test.ts
          packages/server/src/ai/context.test.ts
          packages/server/src/ai/context-components.test.ts
          packages/server/src/ai/client.test.ts
          packages/server/src/ai/plan-lifecycle.test.ts
          packages/server/src/ai/router-cache.test.ts
          packages/server/src/benchmark/h-k.test.ts
          packages/server/src/decks/strategy-profile.test.ts

  card-mutation:
    name: Cards / IR mutation
    needs: changes
    # Non-draft pull requests only (ADR 0034 decision 5): a draft skips it, as it skips the full suite.
    if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-deps
      # Each reviewed card whose definition snapshot entry changed against the base must fail one of
      # its manifest tests on an assertion under every IR mutant; changed unreviewed cards are
      # reported. About 1 second per mutant after a 2.5-minute Vitest listing.
      - run: bun run mutate-cards --changed
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha }}

  card-verification:
    name: Cards / Offline verification gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run test:card-gate
      # Lists that may shrink but must not grow, compared with the pull request's base (or a push's
      # `before` SHA); the script falls back to HEAD's first parent as the promotion check does.
      - name: Check ratchets
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:ratchets
      - run: bun run snapshots:check
      # Each manifest engine test ID names exactly one collected test that names its card (ADR 0034
      # decision 5). It lists the Vitest collection without running it: about 2.5 minutes, measured
      # locally.
      - run: bun run check:manifest-tests
      - run: bun run test:primitive-contracts --output test-results/primitive-contracts
      - run: >-
          bun run card-capabilities
          --primitive-evidence test-results/primitive-contracts
          > test-results/primitive-impact.json
      - name: Check primitive review promotions
        env:
          PROMOTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$PROMOTION_BASE" || "$PROMOTION_BASE" =~ ^0+$ ]] || ! git cat-file -e "$PROMOTION_BASE^{commit}" 2>/dev/null; then
            PROMOTION_BASE=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
            if [[ -z "$PROMOTION_BASE" ]]; then
              echo "::notice::No prior commit exists; skipping base-relative promotion comparison."
              exit 0
            fi
            echo "::warning::Push base unavailable; comparing promotions with HEAD's first parent."
          fi
          bun run primitive-promotions --base "$PROMOTION_BASE" --primitive-evidence test-results/primitive-contracts
      # The upload tolerates artifact-quota errors, which also mutes its if-no-files-found check,
      # so the evidence is required here instead.
      - name: Require primitive contract evidence
        if: always()
        run: test -n "$(find test-results/primitive-contracts test-results/primitive-impact.json -type f -print -quit 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: primitive-contract-evidence
          path: |
            test-results/primitive-contracts/
            test-results/primitive-impact.json
          if-no-files-found: error

  viewer-evidence:
    name: Viewer / Card Test Lab evidence
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # System packages are installed every run; the browser binary itself comes from the cache.
      - run: bunx playwright install-deps chromium
      - run: bunx playwright install chromium
      # Real frontend + real lab backend, no mocked transport. The config boots both servers.
      - run: bun run test:e2e
      # Real frontend + real DB-backed server on the committed Oracle fixture: Play my deck setup
      # and a seeded player game against built-in bots.
      - run: bun run test:e2e:setup
      # The specs record a trace for every test (trace: 'on', preserveOutput: 'always'); this checks
      # tracing is still on. Actions storage is limited, so CI uploads the traces only when a step
      # fails; a passing run's viewer evidence comes from a local run, which keeps its traces. The
      # upload tolerates artifact-quota errors, which also mutes its if-no-files-found check.
      - name: Require viewer traces
        if: always()
        run: test -n "$(find test-results -name trace.zip -print -quit 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: card-test-lab-traces
          path: test-results/
          if-no-files-found: error

  table-e2e:
    name: Table e2e
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install-deps chromium
      - run: bunx playwright install chromium
      # The built table bundle served by `serve:table --dev` from its own origin, two browser
      # contexts per table, on the committed Oracle fixture with a fixed test key. The config
      # builds the bundle and boots the three table servers.
      - run: bun run test:e2e:table
      - name: Require table traces
        if: always()
        run: test -n "$(find test-results/table -name trace.zip -print -quit 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: table-e2e-traces
          path: test-results/table/
          if-no-files-found: error
