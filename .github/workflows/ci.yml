name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only touches prose under these directories cannot change any test, typecheck,
  # lint, or build result, so the heavy jobs below are skipped for it. Each path here must be one that
  # no test, script, or build reads. Files that code does read (docs/rules, docs/plans, docs/reviews,
  # docs/modelled-cards.md, README.md, data/) are deliberately absent. The format job always runs,
  # because prettier also checks Markdown. Pushes to main always run everything.
  changes:
    name: Changes / Classify
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On any diff failure, fail open: run everything.
          # Three-dot diff: files changed on the PR branch since its merge base, not base-branch drift.
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "::warning::Could not compute changed files; running all jobs."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/decisions/*|docs/guides/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          if [[ "$docs_only" == "true" ]]; then
            echo "Docs-only change: skipping code jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs for every change, including docs-only, because prettier checks Markdown.
  format:
    name: Quality / Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run format:check

  typecheck:
    name: Quality / Typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run typecheck
      - run: bun run typecheck:tests

  lint:
    name: Quality / Lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run lint

  web-build:
    name: Quality / Web build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run --cwd apps/web build

  engine-tests:
    name: Engine / Full test suite
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run test

  ai-benchmark-contracts:
    name: AI / Benchmark contracts and privacy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      # Deterministic only: no provider key and no live model calls are available to PR code.
      - run: >-
          bun run test
          packages/server/src/benchmark/hash.test.ts
          packages/server/src/benchmark/source-hash.test.ts
          packages/server/src/benchmark/refresh.test.ts
          packages/server/src/benchmark/capture.test.ts
          packages/server/src/benchmark/promotion.test.ts
          packages/server/src/benchmark/contracts.test.ts
          packages/server/src/benchmark/paths.test.ts
          packages/server/src/benchmark/cases.test.ts
          packages/server/src/benchmark/replay.test.ts
          packages/server/src/benchmark/score.test.ts
          packages/server/src/ai/context.test.ts
          packages/server/src/ai/context-components.test.ts
          packages/server/src/ai/client.test.ts
          packages/server/src/ai/plan-lifecycle.test.ts
          packages/server/src/ai/router-cache.test.ts
          packages/server/src/benchmark/h-k.test.ts
          packages/server/src/decks/strategy-profile.test.ts

  card-verification:
    name: Cards / Offline verification gate
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-deps
      - run: bun run test:card-gate
      - run: bun run snapshots:check
      - run: bun run test:primitive-contracts --output test-results/primitive-contracts
      - run: >-
          bun run card-capabilities
          --primitive-evidence test-results/primitive-contracts
          > test-results/primitive-impact.json
      - name: Check primitive review promotions
        env:
          PROMOTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$PROMOTION_BASE" || "$PROMOTION_BASE" =~ ^0+$ ]] || ! git cat-file -e "$PROMOTION_BASE^{commit}" 2>/dev/null; then
            PROMOTION_BASE=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
            if [[ -z "$PROMOTION_BASE" ]]; then
              echo "::notice::No prior commit exists; skipping base-relative promotion comparison."
              exit 0
            fi
            echo "::warning::Push base unavailable; comparing promotions with HEAD's first parent."
          fi
          bun run primitive-promotions --base "$PROMOTION_BASE" --primitive-evidence test-results/primitive-contracts
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: primitive-contract-evidence
          path: |
            test-results/primitive-contracts/
            test-results/primitive-impact.json
          if-no-files-found: error

  viewer-evidence:
    name: Viewer / Card Test Lab evidence
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # System packages are installed every run; the browser binary itself comes from the cache.
      - run: bunx playwright install-deps chromium
      - run: bunx playwright install chromium
      # Real frontend + real lab backend, no mocked transport. The config boots both servers.
      - run: bun run test:e2e
      # Real frontend + real DB-backed server on the committed Oracle fixture: Play my deck setup
      # and a seeded player game against built-in bots.
      - run: bun run test:e2e:setup
      # Traces are the retained viewer evidence (trace: 'on', preserveOutput: 'always').
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: card-test-lab-traces
          path: test-results/
          if-no-files-found: error
