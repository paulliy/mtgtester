name: CI

# Actions minutes (ADR 0036). Every pull request push runs only the fast checks: format,
# typecheck, lint, web build and the offline card gate. The slow suites run on a pull request only
# when its labels pick them, and on the nightly run and manual dispatch:
#   ci:engine  full test suite with the collection checks and IR mutation (about 25 minutes)
#   ci:lab     Card Test Lab Playwright (the longest suite)
#   ci:setup   Play my deck setup and player game Playwright
#   ci:table   multiplayer table Playwright
#   ci:e2e     all three Playwright suites
#   ci:full    every slow suite
# `CI / Gate` is the one required check: it fails a ready pull request that changed code until at
# least one slow suite has been picked and every picked suite has run green; the nightly run covers
# the suites a pull request left out. The advisory PR fuzz job needs its own `ci:fuzz` label. Pushes
# to main run the fast checks only; the nightly run repeats everything on main when it changed in
# the last day.
on:
  pull_request:
    # labeled: adding a `ci:` label starts its suites without a new push. ready_for_review: the gate
    # passes drafts (they cannot merge) and must be re-evaluated when one is marked ready.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  schedule:
    - cron: '13 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pull request that only touches prose under these directories cannot change any test, typecheck,
  # lint, or build result, so the code checks are skipped for it. Each path here must be one that
  # no test, script, or build reads. Files that code does read (docs/rules, docs/plans, docs/reviews,
  # docs/modelled-cards.md, README.md, data/) are deliberately absent. Format still runs, because
  # prettier also checks Markdown.
  changes:
    name: Changes / Classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
      code: ${{ steps.classify.outputs.code }}
      engine: ${{ steps.classify.outputs.engine }}
      # The slow suites picked: the full suite, each Playwright suite, and whether any was.
      suite: ${{ steps.classify.outputs.suite }}
      lab: ${{ steps.classify.outputs.lab }}
      setup: ${{ steps.classify.outputs.setup }}
      table: ${{ steps.classify.outputs.table }}
      e2e: ${{ steps.classify.outputs.e2e }}
      slow: ${{ steps.classify.outputs.slow }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }
          slow() {
            out suite "$1"; out lab "$2"; out setup "$3"; out table "$4"
            if [[ "$2$3$4" == *true* ]]; then out e2e true; else out e2e false; fi
            if [[ "$1$2$3$4" == *true* ]]; then out slow true; else out slow false; fi
          }
          case "$EVENT_NAME" in
            pull_request) ;;
            push)
              # The pull request already ran its checks on this tree (with "require branches to
              # be up to date" on); the nightly run repeats them.
              out run true; out code true; out engine false; slow false false false false
              exit 0 ;;
            schedule)
              age=$(( $(date +%s) - $(git log -1 --format=%ct HEAD) ))
              if (( age > 25 * 3600 )); then
                echo "No commit on main in the last 25 hours: nothing to run."
                out run false; out code false; out engine false; slow false false false false
                exit 0
              fi
              out run true; out code true; out engine true; slow true true true true
              exit 0 ;;
            *)
              out run true; out code true; out engine true; slow true true true true
              exit 0 ;;
          esac
          out run true
          label() { jq -e --arg name "$1" 'any(.[]; . == $name)' <<< "$LABELS" > /dev/null; }
          suite=false; lab=false; setup=false; table=false
          if label ci:full; then suite=true; lab=true; setup=true; table=true; fi
          if label ci:e2e; then lab=true; setup=true; table=true; fi
          if label ci:engine; then suite=true; fi
          if label ci:lab; then lab=true; fi
          if label ci:setup; then setup=true; fi
          if label ci:table; then table=true; fi
          echo "Slow suites picked by labels: full suite=$suite, lab=$lab, setup=$setup, table=$table."
          slow "$suite" "$lab" "$setup" "$table"
          # On any diff failure, fail open: run every code check.
          # Three-dot diff: files changed on the PR branch since its merge base, not base-branch drift.
          if ! changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "::warning::Could not compute changed files; running all code checks."
            out code true; out engine true
            exit 0
          fi
          if grep -q '^packages/engine/src/' <<< "$changed"; then out engine true; else out engine false; fi
          docs_only=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              docs/decisions/*|docs/guides/*) ;;
              *) docs_only=false; break ;;
            esac
          done <<< "$changed"
          if [[ "$docs_only" == "true" ]]; then
            echo "Docs-only change: skipping code checks."
            out code false
          else
            out code true
          fi

  # One job for the quick checks: each job pays its own checkout, Bun install and per-job minute
  # rounding. Every check runs even when an earlier one fails, so one push reports all of them.
  quality:
    name: Quality / Format, typecheck, lint, web build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: deps
        uses: ./.github/actions/setup-bun-deps
      - run: bun run format:check
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && env.CODE == 'true' }}
        run: bun run typecheck
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && env.CODE == 'true' }}
        run: bun run typecheck:tests
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && env.CODE == 'true' }}
        run: bun run lint
      - if: ${{ !cancelled() && steps.deps.outcome == 'success' && env.CODE == 'true' }}
        run: bun run --cwd apps/web build
      # Deterministic only: no provider key and no live model calls are available to PR code. These
      # files are part of `bun run test`, so they run here only when the full suite does not.
      - name: AI benchmark contracts and privacy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && env.CODE == 'true' && needs.changes.outputs.suite != 'true' }}
        run: >-
          bun run test
          packages/server/src/benchmark/hash.test.ts
          packages/server/src/benchmark/source-hash.test.ts
          packages/server/src/benchmark/refresh.test.ts
          packages/server/src/benchmark/capture.test.ts
          packages/server/src/benchmark/promotion.test.ts
          packages/server/src/benchmark/contracts.test.ts
          packages/server/src/benchmark/paths.test.ts
          packages/server/src/benchmark/cases.test.ts
          packages/server/src/benchmark/replay.test.ts
          packages/server/src/benchmark/score.test.ts
          packages/server/src/ai/context.test.ts
          packages/server/src/ai/context-components.test.ts
          packages/server/src/ai/client.test.ts
          packages/server/src/ai/plan-lifecycle.test.ts
          packages/server/src/ai/router-cache.test.ts
          packages/server/src/benchmark/h-k.test.ts
          packages/server/src/decks/strategy-profile.test.ts

  card-verification:
    name: Cards / Offline verification gate
    needs: changes
    # Pull requests, nightly and dispatch; a push to main merged a pull request that already ran it.
    if: needs.changes.outputs.code == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-deps
      # The full suite runs every card gate file, so when it runs in this workflow the gate checks its
      # list and prints the facet warnings but leaves the tests to it, and they run once.
      - run: bun run test:card-gate $SKIP_RUN
        env:
          SKIP_RUN: ${{ needs.changes.outputs.suite == 'true' && '--skip-run' || '' }}
      # Lists that may shrink but must not grow, compared with the pull request's base (or a push's
      # `before` SHA); the script falls back to HEAD's first parent as the promotion check does.
      - name: Check ratchets
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run check:ratchets
      - run: bun run snapshots:check
      - run: bun run test:primitive-contracts --output test-results/primitive-contracts
      - run: >-
          bun run card-capabilities
          --primitive-evidence test-results/primitive-contracts
          > test-results/primitive-impact.json
      - name: Check primitive review promotions
        env:
          PROMOTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$PROMOTION_BASE" || "$PROMOTION_BASE" =~ ^0+$ ]] || ! git cat-file -e "$PROMOTION_BASE^{commit}" 2>/dev/null; then
            PROMOTION_BASE=$(git rev-parse --verify HEAD^ 2>/dev/null || true)
            if [[ -z "$PROMOTION_BASE" ]]; then
              echo "::notice::No prior commit exists; skipping base-relative promotion comparison."
              exit 0
            fi
            echo "::warning::Push base unavailable; comparing promotions with HEAD's first parent."
          fi
          bun run primitive-promotions --base "$PROMOTION_BASE" --primitive-evidence test-results/primitive-contracts
      # The upload tolerates artifact-quota errors, which also mutes its if-no-files-found check,
      # so the evidence is required here instead.
      - name: Require primitive contract evidence
        if: always()
        run: test -n "$(find test-results/primitive-contracts test-results/primitive-impact.json -type f -print -quit 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: primitive-contract-evidence
          path: |
            test-results/primitive-contracts/
            test-results/primitive-impact.json
          if-no-files-found: error

  # The full suite, then the checks that read the Vitest collection. The suite run writes a JSON
  # report that becomes the collection listing shared by suite-collect, manifest-tests and IR
  # mutation; a separate `vitest list` imported every suite again (about 7 minutes).
  engine-tests:
    name: Engine / Full test suite
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-deps
      - run: >-
          bun run test --reporter=default --reporter=json
          --outputFile.json="$RUNNER_TEMP/vitest-run.json"
      - name: List the Vitest collection
        run: bun run scripts/vitest-run-listing.ts "$RUNNER_TEMP/vitest-run.json" "$RUNNER_TEMP/vitest-list.json"
      # Every tracked test file collects at least one test from its runner (ADR 0034 decision 9).
      - run: bun run check:suite-collect --collected "$RUNNER_TEMP/vitest-list.json"
      # Each manifest engine test ID names exactly one collected test that names its card (ADR 0034
      # decision 5).
      - run: bun run check:manifest-tests --collected "$RUNNER_TEMP/vitest-list.json"
      # Pull requests only (ADR 0034 decision 5): each reviewed card whose definition snapshot entry
      # changed against the base must fail one of its manifest tests on an assertion under every IR
      # mutant; changed unreviewed cards are reported. About 1 second per mutant.
      - name: IR mutation of changed cards
        if: github.event_name == 'pull_request'
        run: bun run mutate-cards --changed --collected "$RUNNER_TEMP/vitest-list.json"
        env:
          MUTATION_BASE: ${{ github.event.pull_request.base.sha }}

  fuzz:
    name: Engine / Fuzz (advisory)
    needs: changes
    # ADR 0034 decision 8, as amended by ADR 0036: seeded four-player games with the state invariants
    # on, for pull requests that change the engine and carry the `ci:fuzz` label. Advisory: an engine
    # change shifts the decision stream, so a seed can start failing on a bug the pull request did
    # not write. The nightly run is authoritative.
    if: >-
      needs.changes.outputs.engine == 'true' && github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'ci:fuzz')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun-deps
      # Six pods (two of each provider mix), plus three for each changed pinned card. Each failure
      # prints the command that replays it.
      - run: bun run fuzz --games 6 --changed --base "$BASE" --jobs 4 --json fuzz.json
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: fuzz-results
          path: fuzz.json
          if-no-files-found: ignore

  # The Card Test Lab, setup and table Playwright suites share one job, so the browser and its
  # system packages are installed once. Each suite runs when its label picked it; the table suite
  # runs even when the lab suites fail.
  viewer-evidence:
    name: Viewer / Card Test Lab evidence and table e2e
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LAB: ${{ needs.changes.outputs.lab }}
      SETUP: ${{ needs.changes.outputs.setup }}
      TABLE: ${{ needs.changes.outputs.table }}
    steps:
      - uses: actions/checkout@v4
      - id: deps
        uses: ./.github/actions/setup-bun-deps
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # System packages are installed every run; the browser binary itself comes from the cache.
      - id: browser
        run: bunx playwright install-deps chromium && bunx playwright install chromium
      # Real frontend + real lab backend, no mocked transport. The config boots both servers.
      - if: env.LAB == 'true'
        run: bun run test:e2e
      # Real frontend + real DB-backed server on the committed Oracle fixture: Play my deck setup
      # and a seeded player game against built-in bots.
      - if: env.SETUP == 'true'
        run: bun run test:e2e:setup
      # The specs record a trace for every test (trace: 'on', preserveOutput: 'always'); this checks
      # tracing is still on. It runs before the table suite writes test-results/table. Actions
      # storage is limited, so CI uploads the traces only when a step fails; a passing run's viewer
      # evidence comes from a local run, which keeps its traces. The upload tolerates artifact-quota
      # errors, which also mutes its if-no-files-found check.
      - name: Require viewer traces
        if: ${{ always() && (env.LAB == 'true' || env.SETUP == 'true') }}
        run: test -n "$(find test-results -name trace.zip -print -quit 2>/dev/null)"
      # The built table bundle served by `serve:table --dev` from its own origin, two browser
      # contexts per table, on the committed Oracle fixture with a fixed test key. The config
      # builds the bundle and boots the three table servers.
      - name: Table e2e
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && env.TABLE == 'true' }}
        run: bun run test:e2e:table
      - name: Require table traces
        if: ${{ !cancelled() && steps.browser.outcome == 'success' && env.TABLE == 'true' }}
        run: test -n "$(find test-results/table -name trace.zip -print -quit 2>/dev/null)"
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: card-test-lab-traces
          path: test-results/
          if-no-files-found: error

  # The single required check. It fails when any job it waits on failed or was cancelled, and on a
  # ready pull request that changed code but has no `ci:` label picking a slow suite. It names the
  # suites left out, which only the nightly run will cover. The advisory fuzz job is not waited on.
  gate:
    name: CI / Gate
    needs: [changes, quality, card-verification, engine-tests, viewer-evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          CODE: ${{ needs.changes.outputs.code }}
          SLOW: ${{ needs.changes.outputs.slow }}
          SUITE: ${{ needs.changes.outputs.suite }}
          LAB: ${{ needs.changes.outputs.lab }}
          SETUP: ${{ needs.changes.outputs.setup }}
          TABLE: ${{ needs.changes.outputs.table }}
        shell: bash
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$NEEDS")
          if [[ -n "$failed" ]]; then
            echo "::error::These jobs did not pass: $(echo $failed)"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$DRAFT" != "true" && "$CODE" == "true" ]]; then
            if [[ "$SLOW" != "true" ]]; then
              echo "::error::Fast checks passed. Pick the slow suites to run before merging: ci:full for all of them, or any of ci:engine, ci:e2e, ci:lab, ci:setup and ci:table."
              exit 1
            fi
            skipped=()
            [[ "$SUITE" == "true" ]] || skipped+=(ci:engine)
            [[ "$LAB" == "true" ]] || skipped+=(ci:lab)
            [[ "$SETUP" == "true" ]] || skipped+=(ci:setup)
            [[ "$TABLE" == "true" ]] || skipped+=(ci:table)
            if (( ${#skipped[@]} > 0 )); then
              echo "::notice::Not run on this pull request (the nightly run covers them): ${skipped[*]}"
            fi
          fi
          echo "Gate passed."
