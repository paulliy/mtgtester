name: Deploy

# Server releases for the VM (docs/guides/deploy-oracle-cloud.md, "Releases"). A push to main that
# touches what the table server runs builds a release here, on GitHub, not on the 1 GB VM:
#
#   1. Install the production dependencies, build the public site, the tables-only bundle and the
#      card files (the server's and the site's)
#      from the pinned Scryfall bank (the SCRYFALL_BULK_URL and SCRYFALL_BULK_SHA256 variables).
#   2. Pack them with the server sources into server-<sha>.tar.gz, with release.json naming the
#      commit, and publish them as the GitHub release server-<sha>.
#   3. Move the server-live tag to the commit. The VM's deploy agent checks that tag every three
#      minutes, waits for running games to end, and switches over; it rolls back on its own if the
#      new release does not answer /health with its commit.
#
# Pull requests are checked by CI before they merge, so this runs only on main. The production
# environment lets a repository admin add a required reviewer for step 3 in the settings.
on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/web/**'
      - 'docs/rules/**'
      - 'deploy/oracle-cloud/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One release at a time; a newer push waits rather than cancelling one half published.
concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Deploy / Build the server release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCRYFALL_BULK_URL: ${{ vars.SCRYFALL_BULK_URL }}
      SCRYFALL_BULK_SHA256: ${{ vars.SCRYFALL_BULK_SHA256 }}
    outputs:
      tag: ${{ steps.pack.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-deps
      - name: Download the pinned bank
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SCRYFALL_BULK_URL" || -z "$SCRYFALL_BULK_SHA256" ]]; then
            echo "::error::Set the SCRYFALL_BULK_URL and SCRYFALL_BULK_SHA256 repository variables."
            exit 1
          fi
          curl -fsSL -A 'mtg-commander-sim/0.1' "$SCRYFALL_BULK_URL" -o oracle-cards.jsonl.gz
          echo "$SCRYFALL_BULK_SHA256  oracle-cards.jsonl.gz" | sha256sum -c -
          bun run scryfall:update --from oracle-cards.jsonl.gz
      - name: Build the web bundles and the card files
        run: |
          bun run --cwd apps/web build:table
          bun run --cwd apps/web build:site
          bun run table:cards
          bun run site:cards
      - id: pack
        name: Pack the release
        shell: bash
        run: bash deploy/oracle-cloud/pack-release.sh "$GITHUB_SHA" release-out
      - uses: actions/upload-artifact@v4
        with:
          name: server-release
          path: release-out/
          retention-days: 7

  publish:
    name: Deploy / Publish and go live
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: server-release
          path: release-out
      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published."
          else
            gh release create "$TAG" release-out/* --target "$GITHUB_SHA" \
              --title "$TAG" --notes "Table server built from $GITHUB_SHA." --latest=false
          fi
      - name: Move server-live to this commit
        run: |
          git tag -f server-live "$GITHUB_SHA"
          git push -f origin refs/tags/server-live
