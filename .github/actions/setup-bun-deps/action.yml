name: Setup Bun and dependencies
description: Install Bun, restore the Bun package cache keyed on bun.lock, and install dependencies with the frozen lockfile. Call after actions/checkout.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    # The Bun install cache is content-addressed by package and version, and bun.lock pins both,
    # so a restored cache can only change download time, not which packages get installed.
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
